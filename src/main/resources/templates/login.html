<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/head :: head('Sign In to InkFlow')}"></th:block>
</head>
<body>

<!-- Navigation Bar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - var(--header-height) - 150px); padding: 2rem 1rem;">
    <div class="container container-sm" style="max-width: 440px;">
        <div class="form-card" style="padding: 2.25rem;">
            <!-- Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.3rem;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    </svg>
                </div>
                <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.35rem;">Welcome Back</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your InkFlow account to write and read stories.</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
                        <button type="button" onclick="togglePasswordVisibility('loginPassword')" style="background: none; border: none; font-size: 0.75rem; color: var(--primary); cursor: pointer;">Show/Hide</button>
                    </div>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
                    Sign In &rarr;
                </button>
            </form>

            <!-- Quick Demo Helper -->
            <div style="margin-top: 1.5rem; padding: 1rem; background: var(--bg-subtle); border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted);">
                <div style="font-weight: 600; margin-bottom: 0.35rem; color: var(--text-main);">Quick Testing Helper</div>
                <div>Need an account? Sign up below or click to prefill:</div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                    <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;" onclick="prefillLogin('admin@blog.com', 'admin123')">Prefill Admin</button>
                    <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.75rem; padding: 0.2rem 0.5rem;" onclick="prefillLogin('writer@blog.com', 'writer123')">Prefill Writer</button>
                </div>
            </div>

            <!-- Footer links -->
            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
                Don't have an account?
                <a href="/register" style="color: var(--primary); font-weight: 600;">Create one now</a>
            </div>
        </div>
    </div>
</main>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Scripts Fragment -->
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

<script>
// ==========================================================================
// Login Controller (Plain Vanilla JavaScript)
// ==========================================================================
document.addEventListener('DOMContentLoaded', () => {
    // If already logged in, redirect to home or dashboard
    if (Auth.isLoggedIn()) {
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || '/';
        window.location.href = redirect;
    }
});

function togglePasswordVisibility(fieldId) {
    const field = document.getElementById(fieldId);
    if (field) {
        field.type = field.type === 'password' ? 'text' : 'password';
    }
}

function prefillLogin(email, password) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = password;
}

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginSubmitBtn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = 'Signing In...';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    try {
        const response = await API.post('/api/v1/auth/login', { email, password });
        
        if (!response || !response.accessToken) {
            throw new Error('Invalid credentials or empty token response.');
        }

        // Save token and user details in localStorage
        Auth.saveAuth(response);
        UI.showToast(`Welcome back, ${response.user ? response.user.name : 'Author'}!`, 'success');

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || '/';

        setTimeout(() => {
            window.location.href = redirect;
        }, 1000);

    } catch (err) {
        console.error('Login error:', err);
        UI.showToast('Login failed: ' + (err.message || 'Invalid email or password.'), 'error');
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}
</script>

</body>
</html>
